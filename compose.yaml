services:
  moth:
    image: moth:dev
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      MOTH_BIND_ADDR: 0.0.0.0:8080
      MOTH_DATA_DIR: /data
      MOTH_CONFIG_FILE: /config/libraries.toml
      MOTH_BOOKS_DIR: /books
      MOTH_WEB_DIR: /app/web
      MOTH_COOKIE_SECURE: ${MOTH_COOKIE_SECURE:-false}
      MOTH_SESSION_TTL_DAYS: ${MOTH_SESSION_TTL_DAYS:-30}
      MOTH_LOG: ${MOTH_LOG:-info}
    volumes:
      - type: bind
        source: ./data
        target: /data
      - type: bind
        source: ${MOTH_CONFIG_PATH:-./config/libraries.toml}
        target: /config/libraries.toml
        read_only: true
      - type: bind
        source: ${MOTH_NOVELS_PATH:-./books/novels}
        target: /books/novels
        read_only: true
      - type: bind
        source: ${MOTH_COMICS_PATH:-./books/comics}
        target: /books/comics
        read_only: true
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
