services:
  moth:
    image: ghcr.io/pzweuj/moth:latest
    user: "0:0"
    ports:
      - "8080:8080"
    volumes:
      - ./data:/data
      - ${MOTH_BOOKS_PATH:-./books}:/books:ro
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --show-error http://127.0.0.1:8080/api/v1/health || exit 1
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    restart: unless-stopped
